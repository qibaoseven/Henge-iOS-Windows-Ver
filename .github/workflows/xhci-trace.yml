name: xHCI full trace

on:
  push:
    branches: [xhci-trace]

permissions:
  contents: write
  actions: write

jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply the full xHCI instrumentation patch
        run: |
          set -euxo pipefail
          git apply --check --whitespace=nowarn ci/xhci-trace.patch
          git apply --whitespace=nowarn ci/xhci-trace.patch
          git diff --stat

      - name: Verify the exact instrumented blobs
        run: |
          set -euxo pipefail
          test "$(git hash-object devices/xhci.c)" = "907125f425996acaa4c2883b4427635d91152b6b"
          test "$(git hash-object devices/xhci_trace.c)" = "a60d7b974d2c8a19c3ff770ad009e253da9e94eb"
          test "$(git hash-object devices/xhci_trace.h)" = "46851d2b06d080308df09fa65afa8bc9bee25809"

      - name: Commit and push to main
        run: |
          set -euxo pipefail
          git config user.name "qibaoseven"
          git config user.email "qibaoseven@qq.com"
          git add devices/xhci.c devices/xhci_trace.c devices/xhci_trace.h
          git commit -m "xhci: add full MMIO, ring, port and transfer tracing"
          git push origin HEAD:main

      - name: Start the IPA build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          sleep 3
          gh workflow run "Build Henge IPA" --ref main
