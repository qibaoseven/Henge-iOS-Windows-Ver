# .github/workflows/build-henge.yml
#
# Builds a Henge.ipa from your fork's main branch on a GitHub-hosted macOS
# runner, no Mac needed. Free on a PUBLIC repo: public repos get unlimited
# minutes on hosted runners, including macOS. On a private repo, macOS minutes
# bill at 10x, so the free tier's ~2000 min/month is only ~200 macOS minutes.
#
# The IPA comes out unsigned with ad-hoc signing (package_ipa.sh's normal
# output). SideStore/AltStore re-signs it with your certificate on install
# and keeps the entitlements it can; increased-memory-limit only survives if
# your certificate carries it, and Henge falls back to file-backed guest RAM
# without it.

name: Build Henge IPA

# Pushes to main build an IPA; the same build can still be started by hand from
# the Actions tab (Build Henge IPA > Run workflow), e.g. to force a firmware refresh.
on:
  push:
    branches: [main]
    # Failure logs are committed by the build itself; don't rebuild for them.
    paths-ignore:
      - "ci-logs/**"
  workflow_dispatch:
    inputs:
      refresh_firmware:
        description: "重新从 firmware-latest 拉取并内嵌 code.fd / vars.fd（默认只在缺失时拉一次）"
        type: boolean
        default: false

# contents: write is for the one-off firmware embed below (commit the two banks
# into ios/Henge/Resources); everything else in this job only reads.
permissions:
  contents: write

env:
  HUSK: ${{ github.workspace }}/Husk
  # The Makefile takes its slirp headers from IOS_DEPS, not HUSK:
  #   IOS_DEPS ?= $(HOME)/Documents/Coding/Husk/build/ios-arm64/sysroot
  # (HUSK is only read by ios/scripts/fetch_deps.sh.)
  IOS_DEPS: ${{ github.workspace }}/Husk/build/ios-arm64/sysroot

jobs:
  build:
    # Xcode 27 image (arm64, GA since Oct 2026). Plain `xcode-27` is a standard
    # runner, so it's free on public repos; `xcode-27-xlarge` is a paid larger
    # runner. Table: https://github.com/actions/runner-images#available-images
    runs-on: xcode-27
    timeout-minutes: 120

    steps:
      - name: Check out Henge (this fork)
        uses: actions/checkout@v4
        with:
          path: Henge

      # code.fd / vars.fd are ordinary app resources (ios/Henge/Resources, which
      # XcodeGen copies into Henge.app), not something the device fetches: the
      # firmware release is only the source for the first commit. Doing it here
      # keeps the IPA self-contained without a download step on every build --
      # after the first run the two banks are in git and this is a no-op.
      # 128 MB of repo history per embed; refresh_firmware=true replaces them
      # with the current firmware-latest assets.
      - name: Embed firmware into the bundle (first run only)
        working-directory: Henge
        # A failed push must not kill the IPA: the files are already copied
        # locally and the verify step below still holds. The next run retries.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REFRESH: ${{ github.event.inputs.refresh_firmware }}
        run: |
          set -euxo pipefail
          FW=ios/Henge/Resources
          need=0
          if [ "$REFRESH" = "true" ]; then need=1; fi
          for f in code.fd vars.fd; do [ -f "$FW/$f" ] || need=1; done
          if [ "$need" = "0" ]; then
            echo "firmware already in the bundle:"
            ls -l "$FW/code.fd" "$FW/vars.fd"
            exit 0
          fi
          gh release download firmware-latest -p code.fd -p vars.fd -D /tmp/fw --clobber
          python3 - <<'PY'
          import os, sys
          for name in ('code.fd', 'vars.fd'):
              p = os.path.join('/tmp/fw', name)
              if os.path.getsize(p) != 64 << 20:
                  sys.exit(f'{name}: not one 64 MB bank')
              if b'_FVH' not in open(p, 'rb').read(0x2000):
                  sys.exit(f'{name}: no FV header in the first 8 KB')
          print('firmware assets: 64 MB each, FV header present')
          PY
          cp /tmp/fw/code.fd /tmp/fw/vars.fd "$FW"/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 128 MB in one commit: git's default 1 MB postBuffer dies with HTTP 413.
          git config http.postBuffer 524288000
          git config http.version HTTP/1.1
          git config http.lowSpeedLimit 1000
          git config http.lowSpeedTime 300
          git add "$FW/code.fd" "$FW/vars.fd"
          if git diff --cached --quiet; then
            echo "embedded firmware is already identical; nothing to commit"
            exit 0
          fi
          git commit -m "firmware: embed code.fd / vars.fd from firmware-latest"
          git push origin "HEAD:${GITHUB_REF_NAME}" || {
            echo "push failed; rebasing on the remote branch and retrying once"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          }

      # Fail here, before Husk's ~30 minute dependency build, if the bundle does
      # not actually carry the banks: WinStore.prepare() looks them up as
      # Bundle.main code.fd / vars.fd and refuses to boot without them.
      - name: Verify the bundled firmware
        working-directory: Henge
        run: |
          python3 - <<'PY'
          import os, sys
          for name in ('code.fd', 'vars.fd'):
              p = os.path.join('ios/Henge/Resources', name)
              if not os.path.exists(p):
                  sys.exit(f'{p} is missing; run this workflow once to embed firmware-latest')
              if os.path.getsize(p) != 64 << 20:
                  sys.exit(f'{p}: {os.path.getsize(p)} bytes, expected one 64 MB bank')
              if b'_FVH' not in open(p, 'rb').read(0x2000):
                  sys.exit(f'{p}: no FV header in the first 8 KB')
          print('firmware: code.fd / vars.fd, 64 MB each, FV header present')
          PY

      # fetch_deps.sh copies prebuilt pieces out of a BUILT Husk checkout:
      # StikJIT.xcframework (vendored in Husk's repo, comes with checkout),
      # libhusk_rppairing.a (scripts/build_rppairing_ios.sh) and the
      # libslirp/glib/intl/pcre2 static libs (scripts/build_ios.sh).
      - name: Check out Husk
        uses: actions/checkout@v4
        with:
          repository: Leviidev/Husk
          path: Husk

      - name: Cache Husk's sources and prebuilt iOS pieces
        uses: actions/cache@v4
        with:
          path: |
            Husk/third_party/build
            Husk/build
          key: husk-ios-arm64-${{ hashFiles('Husk/scripts/build_ios.sh', 'Husk/scripts/fetch_sources.sh') }}

      - name: Install build tools
        run: |
          set -euxo pipefail
          brew install xcodegen meson ninja pkg-config
          # Runner images ship rustup; add the iOS target if it's missing.
          rustup target add aarch64-apple-ios || {
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            rustup target add aarch64-apple-ios
          }

      # build_ios.sh builds from third_party/build/<name>; the sources are
      # fetched by fetch_sources.sh, which Husk's own ci_build.sh runs first.
      - name: Fetch Husk's third-party sources
        working-directory: Husk
        run: bash scripts/fetch_sources.sh

      # Henge only needs these three sysroot pieces: libffi (a glib dep),
      # glib (whose meson subprojects also produce libpcre2-8 and libintl),
      # and libslirp (the guest network). Skip Husk's pixman/libucontext/qemu
      # stages entirely: that's the Android emulator, minutes instead of an
      # hour-plus.
      - name: Build the iOS libraries Henge needs
        working-directory: Husk
        run: bash scripts/build_ios.sh libffi glib libslirp

      - name: Build Husk's on-device pairing library
        working-directory: Husk
        run: bash scripts/build_rppairing_ios.sh

      - name: Copy prebuilt deps into Henge
        working-directory: Henge
        run: zsh ios/scripts/fetch_deps.sh

      - name: Build the restore stack (libirecovery, usbmuxd, idevicerestore)
        working-directory: Henge
        run: zsh tools/build_ios_restore.sh

      - name: Build the engine
        working-directory: Henge
        run: make ios-lib

      - name: Package Henge.ipa
        working-directory: Henge
        run: zsh ios/scripts/package_ipa.sh

      - name: Upload Henge.ipa
        uses: actions/upload-artifact@v4
        with:
          name: Henge-ipa-${{ github.sha }}
          path: /Users/runner/Desktop/Henge.ipa
          if-no-files-found: error

      - name: Package Henge.tipa
        working-directory: Henge
        run: zsh ios/scripts/package_ipa.sh --trollstore

      - name: Upload Henge.tipa
        uses: actions/upload-artifact@v4
        with:
          name: Henge-tipa-${{ github.sha }}
          path: /Users/runner/Desktop/Henge.tipa
          if-no-files-found: error

      # Symbols for lldb: package_ipa.sh only makes the .ipa, so this is where
      # the Release build's .dSYM comes from.
      - name: Upload dSYMs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Henge-dSYM-${{ github.sha }}
          path: Henge/ios/build/DerivedData/Build/Products/Release-iphoneos/*.dSYM
          if-no-files-found: warn

      # Job logs live in blob storage, which is painful to read from a phone.
      # On failure, put xcodebuild's full output in the repo (raw readable) so a
      # diagnosis does not depend on a screenshot of the log.
      - name: Publish the build log on failure
        if: failure()
        continue-on-error: true
        working-directory: Henge
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euxo pipefail
          LOG=ios/build/DerivedData.buildlog
          [ -f "$LOG" ] || { echo "xcodebuild never ran; no log"; exit 0; }
          mkdir -p ci-logs
          cp "$LOG" ci-logs/henge-build.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config http.postBuffer 524288000
          git config http.version HTTP/1.1
          git add -f ci-logs/henge-build.log
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ci(ios): publish the Xcode build log [skip ci]"
          git pull --rebase origin "$BRANCH_NAME" || true
          git push origin "HEAD:$BRANCH_NAME" || true

# Rebuild trigger: devices/xhci.c commit 6d919c4 was pushed by GITHUB_TOKEN and
# therefore did not start a workflow; this comment makes the next build run on
# the fixed source.
