name: firmware

# Builds the two 64 MB pflash banks the Windows board needs (code.fd / vars.fd)
# and publishes them as a release asset, so the iPad can just pull them:
#
#   gh release download firmware-latest -p '*.fd' -D out/firmware
#
# Why Linux and not macOS: ArmVirtQemu is AARCH64-only, and edk2's
# tools_def.template has no XCODE5_AARCH64 at all -- XCODE5 emits Mach-O and
# covers IA32/X64, so `-t XCODE5 -a AARCH64` cannot work on any Mac. What this
# target needs is a GNU cross compiler that emits ELF, which GenFw then turns
# into PE/COFF: apt's gcc-aarch64-linux-gnu delivers that in one install, on an
# x86 runner that is cheaper and faster than a macOS one.
#
# No signing key and no secret to configure: the firmware is not code-signed
# (Secure Boot off), and the release is published with the token every workflow
# already has -- it only needs `permissions: contents: write` below.

# Pushing is what triggers it: no manual dispatch needed, and no path filter --
# any push to the default branches rebuilds, so the asset is never stale.
on:
  push:
    branches: [main, master]
  workflow_dispatch: # kept as an escape hatch, not the normal way in

permissions:
  contents: write # create/update the firmware-latest release

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Cross toolchain and ACPI compiler
        run: |
          set -eux
          sudo apt-get update
          # uuid-dev matters: BaseTools' GenFw links with -luuid, and the runner
          # image has the runtime library but not the .so to link against, so the
          # host tools stop at "cannot find -luuid".
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu acpica-tools uuid-dev
          aarch64-linux-gnu-gcc --version | head -1
          # ArmVirtQemu compiles ASL, so iasl has to be there (acpica-tools).
          command -v iasl

      # edk2 is ~200 MB of clone plus submodules; without a cache each run pays
      # for it again. The key follows the script, because the script decides
      # which submodules are fetched and how BaseTools is built.
      - name: Cache edk2
        uses: actions/cache@v4
        with:
          path: third_party/edk2
          key: edk2-${{ runner.os }}-stable202408-${{ hashFiles('tools/build-firmware.sh') }}

      - name: Build ArmVirtQemu (AARCH64, RELEASE)
        run: |
          chmod +x tools/build-firmware.sh
          ./tools/build-firmware.sh --source
        env:
          EDK2: ${{ github.workspace }}/third_party/edk2

      - name: Verify the banks
        run: |
          ls -l out/firmware
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, '.')
          bank = 64 << 20
          for name in ('code.fd', 'vars.fd'):
              p = os.path.join('out', 'firmware', name)
              if not os.path.exists(p):
                  sys.exit(f'missing {p}')
              size = os.path.getsize(p)
              if size != bank:
                  sys.exit(f'{name} is {size} bytes, expected one 64 MB bank')
          with open('out/firmware/code.fd', 'rb') as f:
              # ArmVirtQemu's FD starts with a 4-byte "b 0x1000" branch stub and
              # puts the FV at 0x1000 (_FVH lands at 0x1028), so the first 4 KB
              # never contains the signature.
              head = f.read(0x2000)
          if b'_FVH' not in head:
              sys.exit('code.fd has no firmware volume header in the first 8 KB')
          print('code.fd: FV header present' + (' at 0x1000' if b'_FVH' not in head[:0x1000] else '') + ', 64 MB')
          print('vars.fd: 64 MB')
          PY
          sha256sum out/firmware/*.fd | tee out/firmware/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: pflash
          path: |
            out/firmware/code.fd
            out/firmware/vars.fd
            out/firmware/SHA256SUMS
          retention-days: 90

      # A fixed tag rather than a new one each run, so "download the latest"
      # stays one command and does not accumulate 128 MB per build.
      - name: Publish firmware-latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view firmware-latest >/dev/null 2>&1 \
            || gh release create firmware-latest \
                 --title "UEFI pflash (ArmVirtQemu AARCH64)" \
                 --notes "code.fd / vars.fd, two 64 MB pflash banks. Built from edk2 by .github/workflows/firmware.yml."
          gh release upload firmware-latest \
            out/firmware/code.fd out/firmware/vars.fd out/firmware/SHA256SUMS --clobber

      - name: How to pull it
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ### 固件已发布
          在仓库里拉回三个文件：

          \`\`\`
          gh release download firmware-latest -p '*.fd' -D out/firmware
          ./tools/stage-app-resources.sh
          \`\`\`

          不用先创建工作目录，\`-D\` 会建。校验：\`sha256sum -c out/firmware/SHA256SUMS\`。
          EOF
