# Builds the two pflash volumes the board boots from and publishes them as the
# `firmware-latest` release: code.fd (UEFI, read-only) and vars.fd (NVRAM, writable).
#
# Both are ArmVirtQemu AARCH64 builds -- the machine devices/winvirt.c emulates is
# QEMU's `virt` with a Windows-shaped device set -- so a stock ArmVirtQemu build is
# what the app wants. See tools/build-firmware.sh for the 64 MB bank rule and for
# the host-toolchain fixes (BaseTools -Werror, Pccts under GCC 13/14).
#
# Runs on Linux, not macOS: edk2 has no XCODE5_AARCH64 target at all (XCODE5
# produces Mach-O for IA32/X64), and an AARCH64 UEFI build has to emit ELF that
# GenFw then converts to PE/COFF. apt's gcc-aarch64-linux-gnu does that in one
# install; on a Mac it takes a keg-installed cross gcc.
name: firmware

on:
  push:
    branches: [main, master]
    paths:
      - 'tools/build-firmware.sh'
      - '.github/workflows/firmware.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Cross toolchain and ACPI compiler
        run: |
          set -eux
          sudo apt-get update
          # uuid-dev matters: BaseTools' GenFw is linked with `-luuid` and the
          # runner image ships the runtime but not the .so to link against, so
          # the host tools stop at
          #   ld: cannot find -luuid
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu acpica-tools uuid-dev
          aarch64-linux-gnu-gcc --version | head -1
          # ArmVirtQemu compiles ASL, so iasl has to be there (acpica-tools).
          command -v iasl

      # edk2 is ~200 MB of clone plus submodules; without a cache each run pays
      # for it again. The key follows the script, because the script decides
      # which submodules are fetched and how BaseTools is built.
      - name: Cache edk2
        uses: actions/cache@v4
        with:
          path: third_party/edk2
          key: edk2-${{ runner.os }}-stable202408-${{ hashFiles('tools/build-firmware.sh') }}

      - name: Build ArmVirtQemu (AARCH64, RELEASE)
        run: |
          chmod +x tools/build-firmware.sh
          ./tools/build-firmware.sh --source

      - name: Verify the banks
        run: |
          set -eux
          for f in out/firmware/code.fd out/firmware/vars.fd; do
            test -f "$f"
            size=$(stat -c %s "$f")
            test "$size" -eq $((64 * 1024 * 1024))
          done
          # A UEFI firmware volume starts with a _FVH signature a few bytes in;
          # without it the app would boot into nothing.
          python3 - <<'PY'
import sys
with open('out/firmware/code.fd', 'rb') as f:
    head = f.read(0x100)
assert b'_FVH' in head, 'code.fd has no firmware volume header'
print('code.fd: _FVH at offset', head.index(b'_FVH') - 0x28)
PY
          ls -l out/firmware

      - name: Publish firmware-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          # One rolling release, overwritten each run: the app fetches a fixed URL.
          gh release view firmware-latest >/dev/null 2>&1 \
            || gh release create firmware-latest --title 'Firmware (ArmVirtQemu AARCH64)' \
                 --notes 'code.fd + vars.fd, 64 MB pflash banks, built from edk2-stable202408 by firmware.yml.'
          gh release upload firmware-latest out/firmware/code.fd out/firmware/vars.fd --clobber
          gh release view firmware-latest --json assets --jq '.assets[] | "\(.name) \(.size)"'
