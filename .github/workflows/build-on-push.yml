# .github/workflows/build-on-push.yml
#
# 每次推送到 main 自动跑一次 Build Henge IPA，省得手动点 Run workflow。
# 真正的编译仍在 build-henge.yml 里，这里只负责发一张 workflow_dispatch 票。
#
# 用 GITHUB_TOKEN 派发的运行不会反过来再触发 push 事件；build-henge.yml 里
# 内嵌固件、上传失败日志产生的提交也不会造成循环。

name: Build IPA on push

on:
  push:
    branches: [main]
    # 失败日志的提交不需要再触发一次编译。
    paths-ignore:
      - "ci-logs/**"

permissions:
  actions: write

concurrency:
  group: henge-ipa
  cancel-in-progress: true

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Ask Build Henge IPA to run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-henge.yml --ref "$GITHUB_REF_NAME"
